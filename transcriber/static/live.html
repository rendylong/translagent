<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>实时字幕</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2022%2022'%3E%3Cg%20fill='%23e9ebef'%3E%3Crect%20x='0'%20y='8'%20width='2.6'%20height='6'%20rx='1.3'/%3E%3Crect%20x='4.8'%20y='4.8'%20width='2.6'%20height='12.4'%20rx='1.3'/%3E%3Crect%20x='9.7'%20y='1.5'%20width='2.6'%20height='19'%20rx='1.3'/%3E%3Crect%20x='14.6'%20y='6'%20width='2.6'%20height='10'%20rx='1.3'/%3E%3Crect%20x='19.4'%20y='8.8'%20width='2.6'%20height='4.4'%20rx='1.3'/%3E%3C/g%3E%3Ccircle%20cx='19'%20cy='4'%20r='2.4'%20fill='%23ff453a'/%3E%3C/svg%3E">
<style>
  :root{ color-scheme: light dark; }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:#e9ebef;
    font:14px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:#0c0e12 radial-gradient(1200px 700px at 50% 30%, #141821 0%, #0c0e12 62%);
    overflow:hidden;
  }
  button{font:inherit}
  [hidden]{display:none !important}

  /* ---------- 开始前表单 ---------- */
  .setup{position:fixed;inset:0;display:grid;place-items:center;padding:20px}
  .card{
    width:min(420px,94vw);background:rgba(20,23,29,.92);border:1px solid rgba(255,255,255,.09);
    border-radius:14px;padding:26px 28px 22px;backdrop-filter:blur(12px);
    box-shadow:0 18px 50px rgba(0,0,0,.45);
  }
  .card h1{margin:0;font-size:19px;letter-spacing:.02em;display:flex;align-items:center;gap:9px}
  .card h1 i{width:10px;height:10px;border-radius:50%;background:#ff453a;flex:none}
  .card .sub{margin:6px 0 18px;font-size:12.5px;color:rgba(233,235,239,.55)}
  .fld{margin-top:12px}
  .fld label{display:block;font-size:12px;color:rgba(233,235,239,.55);margin-bottom:5px}
  .fld input,.fld select{
    width:100%;height:36px;border:1px solid rgba(255,255,255,.14);border-radius:8px;
    padding:0 10px;font-size:13.5px;background:rgba(255,255,255,.05);color:#e9ebef;
  }
  .fld input::placeholder{color:rgba(233,235,239,.3)}
  .fld select option{background:#1a1e25;color:#e9ebef}
  .note{font-size:11.5px;color:rgba(233,235,239,.4);margin-top:5px}
  .go{
    margin-top:18px;width:100%;height:42px;border:0;border-radius:9px;cursor:pointer;
    background:#e9ebef;color:#14171c;font-size:14.5px;font-weight:650;
    display:flex;align-items:center;justify-content:center;gap:9px;
  }
  .go:hover{background:#fff}
  .go:disabled{opacity:.55;cursor:default}
  .go i{width:11px;height:11px;border-radius:50%;background:#ff453a;flex:none}
  .err{margin:12px 0 0;font-size:12.5px;color:#ff8a80;line-height:1.5}
  .resuming{
    margin-top:14px;font-size:12.5px;color:rgba(233,235,239,.6);text-align:center;
  }
  .resuming button{border:0;background:none;color:#8ab4f8;cursor:pointer;text-decoration:underline;padding:0 2px;font-size:12.5px}

  /* ---------- 运行中舞台 ---------- */
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
    font-size:11.5px;color:rgba(233,235,239,.28);pointer-events:none;white-space:nowrap}

  /* 字幕条形态:深色半透明、圆角 12px、白字;flex 列,可含滚动历史区(.blog) */
  .bar{
    position:fixed;width:min(760px,92vw);border-radius:12px;
    background:rgba(12,14,18,.60);backdrop-filter:blur(16px) saturate(1.25);
    -webkit-backdrop-filter:blur(16px) saturate(1.25);
    border:1px solid rgba(255,255,255,.09);color:#fff;
    padding:12px 18px 13px;box-shadow:0 14px 44px rgba(0,0,0,.42);
    transition:box-shadow .15s;
    display:flex;flex-direction:column;
  }
  .bar:hover{box-shadow:0 18px 54px rgba(0,0,0,.55)}
  /* 历史区:网页叠加态限高 ~3 行;悬浮窗内被注入 CSS 释放为 flex 主区(随窗口高) */
  .blog{overflow-y:auto;min-height:0;max-height:66px;scrollbar-width:thin;
    margin:0 0 4px;padding:0 2px;-webkit-mask-image:linear-gradient(transparent 0,#000 10px)}
  .blog[hidden]{display:none}
  .blog .e{margin:2px 0;padding:0}
  .blog .e .txt{font-size:13px;line-height:1.5}
  .blog .e .who{font-size:11px}
  .blog .e .tr{font-size:11.5px;padding-left:17px}
  .blog .e .dot{width:7px;height:7px}
  .blog .e.skip .skiptxt{font-size:11px}
  .bar .grab{
    position:absolute;left:50%;top:3px;transform:translateX(-50%);
    width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.34);
    opacity:0;transition:opacity .15s;cursor:grab;
  }
  .bar:hover .grab{opacity:1}
  .bar .grab:active{cursor:grabbing}
  .bar .actions{
    position:absolute;right:8px;top:-34px;display:flex;gap:6px;
    opacity:0;transition:opacity .15s;pointer-events:none;
  }
  .bar:hover .actions{opacity:1;pointer-events:auto}
  .bar .actions button{
    height:26px;padding:0 11px;border:0;border-radius:7px;cursor:pointer;font-size:12.5px;
    background:rgba(12,14,18,.72);backdrop-filter:blur(12px);color:#e9ebef;
    border:1px solid rgba(255,255,255,.12);white-space:nowrap;
  }
  .bar .actions button:hover{background:rgba(38,42,50,.9)}
  .bar .actions .danger{color:#ff8a80}
  .bar .bline{min-height:1.5em}
  .bar .bmain{display:flex;align-items:baseline;gap:8px;font-size:15.5px;line-height:1.55}
  .bar .bmain .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#98a2b3;
    align-self:center}
  .bar .bmain .who{flex:none;font-size:12px;color:rgba(255,255,255,.62);font-weight:600}
  .bar .bmain .txt{min-width:0;overflow-wrap:anywhere}
  .bar .bmain.fallback .txt{color:rgba(255,255,255,.6)}
  .bar .btrans{margin-top:3px;padding-left:17px;font-size:12.5px;color:rgba(255,255,255,.72);
    line-height:1.5;overflow-wrap:anywhere}
  .bar .bpartial{margin-top:5px;padding-left:17px;font-size:14px;
    color:rgba(255,255,255,.55);overflow-wrap:anywhere}
  .caret{display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-2px;
    background:currentColor;animation:blink 1.1s steps(2,start) infinite}
  @keyframes blink{50%{opacity:0}}
  .chip{
    display:inline-flex;align-items:center;font-size:11.5px;padding:2px 9px;border-radius:999px;
    background:rgba(255,179,46,.16);color:#ffc46b;border:1px solid rgba(255,179,46,.32);
    white-space:nowrap;
  }
  .bar .statebar{display:flex;gap:8px;margin-top:9px}
  .bar .statebar:empty{display:none}

  /* 完整面板形态:随系统深浅色 */
  .panel{
    position:fixed;width:min(880px,94vw);height:min(640px,80vh);border-radius:14px;
    display:flex;flex-direction:column;overflow:hidden;
    background:light-dark(#ffffff,#1d2026);color:light-dark(#1b1e23,#e9ebef);
    border:1px solid light-dark(#e5e7ea,#2e323a);
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .phead{
    flex:none;height:46px;display:flex;align-items:center;gap:10px;padding:0 14px;
    border-bottom:1px solid light-dark(#e5e7ea,#2c3038);cursor:grab;user-select:none;
  }
  .phead:active{cursor:grabbing}
  .phead .pulse{flex:none;width:9px;height:9px;border-radius:50%;background:#ff453a;
    animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .phead .live{font-size:12px;font-weight:700;letter-spacing:.08em;
    color:light-dark(#b3261e,#ff6961)}
  .phead .timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600}
  .phead .ptitle{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;color:light-dark(#575f6b,rgba(233,235,239,.6))}
  .phead button{
    flex:none;width:30px;height:30px;border:1px solid light-dark(#e5e7ea,#3a3f48);
    background:light-dark(#fff,#262a31);color:light-dark(#575f6b,#c6cbd3);
    border-radius:8px;cursor:pointer;font-size:14px;line-height:1;display:inline-flex;
    align-items:center;justify-content:center;
  }
  .phead button:hover{background:light-dark(#f0f1f3,#30353d)}

  .pbody{flex:1;overflow-y:auto;padding:10px 18px 16px;scrollbar-width:thin}
  .pbody .empty{color:light-dark(#8a93a0,rgba(233,235,239,.35));font-size:13px;
    padding:14px 2px 0}
  .e{margin:8px 0;padding:2px 0;animation:fadein .2s ease;border-radius:6px}
  @keyframes fadein{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
  .e .row{display:flex;align-items:baseline;gap:8px}
  .e .dot{flex:none;width:9px;height:9px;border-radius:50%;background:#98a2b3;align-self:center}
  .e .who{flex:none;font-size:12px;font-weight:650;color:light-dark(#575f6b,rgba(233,235,239,.6))}
  .e .txt{min-width:0;overflow-wrap:anywhere;font-size:14.5px}
  .e.f1 .txt{color:light-dark(#7c8592,rgba(233,235,239,.62))}
  .e.p2 .txt{font-weight:550}
  .e .tr{display:block;margin-top:2px;padding-left:17px;font-size:12.5px;
    color:light-dark(#575f6b,rgba(233,235,239,.58));overflow-wrap:anywhere}
  .e.skip .skiptxt{font-size:12px;color:light-dark(#9aa2ad,rgba(233,235,239,.35))}
  .active{margin:8px 0 4px;padding:2px 0;color:light-dark(#7c8592,rgba(233,235,239,.55));
    font-size:14.5px;overflow-wrap:anywhere;min-height:1.6em}

  .pfoot{
    flex:none;min-height:52px;display:flex;align-items:center;gap:8px;padding:8px 14px;
    border-top:1px solid light-dark(#e5e7ea,#2c3038);flex-wrap:wrap;
  }
  .badge{
    font-size:11.5px;padding:2px 10px;border-radius:999px;white-space:nowrap;
    border:1px solid light-dark(#e5e7ea,#3a3f48);color:light-dark(#8a93a0,rgba(233,235,239,.5));
    transition:color .2s,border-color .2s,background .2s;
  }
  .badge.b-asr.on{color:#1d5290;border-color:#9cc4f0;background:#e5eef8}
  .badge.b-fix.on{color:#8f520c;border-color:#eedcb4;background:#faf0dc}
  .badge.b-tr.on{color:#1f6b45;border-color:#bfe3ce;background:#e3f1e9}
  @media (prefers-color-scheme: dark){
    .badge.b-asr.on{color:#9cc4f0;border-color:#2c4a68;background:#182735}
    .badge.b-fix.on{color:#ffc46b;border-color:#5c4718;background:#332814}
    .badge.b-tr.on{color:#8fd4ab;border-color:#27503a;background:#152b1e}
  }
  .stopbtn{
    margin-left:auto;height:34px;padding:0 20px;border:0;border-radius:8px;cursor:pointer;
    background:light-dark(#1e2126,#333842);color:#fff;font-size:13.5px;font-weight:650;
    display:inline-flex;align-items:center;gap:8px;white-space:nowrap;
  }
  .stopbtn:hover{background:light-dark(#33373d,#3d434e)}
  .stopbtn:disabled{opacity:.5;cursor:default}
  .stopbtn i{width:10px;height:10px;border-radius:2px;background:currentColor;display:inline-block}

  .popover{
    position:absolute;right:14px;bottom:60px;z-index:5;min-width:250px;
    background:light-dark(#fff,#262a31);border:1px solid light-dark(#e5e7ea,#3a3f48);
    border-radius:11px;padding:13px 15px;box-shadow:0 12px 34px rgba(0,0,0,.3);
  }
  .popover dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px}
  .popover dt{color:light-dark(#8a93a0,rgba(233,235,239,.5))}
  .popover dd{margin:0;overflow-wrap:anywhere;text-align:right}

  /* ---------- 结束卡 ---------- */
  #endwrap{position:fixed;inset:0;display:grid;place-items:center;
    background:rgba(8,9,12,.58);backdrop-filter:blur(8px);z-index:20}
  .ecard{
    width:min(430px,92vw);text-align:center;background:rgba(20,23,29,.96);
    border:1px solid rgba(255,255,255,.1);border-radius:16px;padding:34px 32px 28px;
    box-shadow:0 24px 70px rgba(0,0,0,.5);
  }
  .ecard .okmark{width:44px;height:44px;margin:0 auto 14px;border-radius:50%;
    background:rgba(52,199,89,.14);display:flex;align-items:center;justify-content:center}
  .ecard .okmark svg{display:block}
  .ecard .etitle{font-size:16.5px;font-weight:650;line-height:1.5}
  .ecard .esub{margin:9px 0 0;font-size:13px;color:rgba(233,235,239,.55);line-height:1.6}
  .ecard .elink{
    display:inline-block;margin-top:14px;font-size:13.5px;color:#8ab4f8;
    text-decoration:none;border:1px solid rgba(138,180,248,.4);border-radius:8px;
    padding:7px 18px;
  }
  .ecard .elink:hover{background:rgba(138,180,248,.1)}
  .ecard .ego{
    display:block;margin:18px auto 0;height:38px;min-width:180px;border:0;border-radius:9px;
    background:#e9ebef;color:#14171c;font-size:14px;font-weight:650;cursor:pointer;
  }
  .ecard .ego:hover{background:#fff}
  .ecard .ego.ghost{
    background:transparent;color:rgba(233,235,239,.6);font-weight:500;
    border:1px solid rgba(255,255,255,.14);margin-top:10px;min-width:120px;height:32px;
  }
  .ecard .ego.ghost:hover{color:#e9ebef;background:rgba(255,255,255,.06)}
</style>
</head>
<body>

<!-- 开始前:会话表单 -->
<section class="setup" id="setup">
  <form class="card" id="setupForm">
    <h1><i></i>实时字幕</h1>
    <p class="sub">会议现场实时字幕 · 音频只在本机处理,不经任何外部服务</p>
    <div class="fld">
      <label for="fTitle">标题</label>
      <input id="fTitle" type="text" maxlength="80" placeholder="会议标题(可留空)">
    </div>
    <div class="fld">
      <label for="fSpeakers">说话人数</label>
      <select id="fSpeakers">
        <option value="0">自动</option>
        <option value="1">1 人</option>
        <option value="2" selected>2 人</option>
        <option value="3">3 人</option>
        <option value="4">4 人以上</option>
      </select>
    </div>
    <div class="fld">
      <label for="fSrc">识别语言</label>
      <select id="fSrc">
        <option value="zh" selected>中文</option>
        <option value="en">英文</option>
        <option value="ja">日文</option>
      </select>
    </div>
    <div class="fld">
      <label for="fTgt">翻译目标</label>
      <select id="fTgt">
        <option value="">不翻译</option>
        <option value="zh">中文</option>
        <option value="en" selected>英文</option>
        <option value="ja">日文</option>
      </select>
      <p class="note">识别与说话人分离即时可用;修正与翻译事件到达时自动上屏;全程仅在本机使用。</p>
    </div>
    <button class="go" id="goBtn" type="submit"><i></i>开始实时字幕</button>
    <p class="note" id="resumeNote" hidden></p>
    <p class="err" id="setupErr" hidden></p>
  </form>
</section>

<!-- 运行中:字幕条 + 完整面板 双形态 -->
<div id="stage" hidden>
  <div class="bar" id="bar">
    <div class="grab" id="barGrab" title="拖动移动"></div>
    <div class="actions" id="barActions">
      <button type="button" id="barExpand" title="展开完整面板">展开面板</button>
      <button type="button" id="barPause" title="暂停显示(后台继续记录)">暂停显示</button>
      <button type="button" id="barStop" class="danger" title="停止">■ 停止</button>
    </div>
    <div class="blog" id="barLog" hidden></div>
    <div class="bline bmain" id="barMain">
      <i class="dot" id="barDot"></i><b class="who" id="barWho"></b><span class="txt" id="barText">等待语音…</span>
    </div>
    <div class="bline btrans" id="barTrans" hidden></div>
    <div class="bline bpartial" id="barPartialLine"><span id="barPartial"></span><i class="caret"></i></div>
    <div class="statebar" id="barState"></div>
  </div>

  <div class="panel" id="panel" hidden>
    <header class="phead" id="panelHead">
      <span class="pulse"></span><b class="live">LIVE</b><span class="timer" id="timer">00:00</span>
      <span class="ptitle" id="panelTitle"></span>
      <button type="button" id="panelSettings" title="会话信息">⚙</button>
      <button type="button" id="panelCollapse" title="收起为字幕条">—</button>
    </header>
    <div class="pbody" id="plist">
      <p class="empty" id="plistEmpty">等待语音…说话后 2 秒内出现灰色实时字。</p>
      <div class="active" id="activeLine" hidden><span id="activeText"></span><i class="caret"></i></div>
    </div>
    <footer class="pfoot">
      <span class="badge b-asr" id="bdgAsr">识别</span>
      <span class="badge b-fix" id="bdgFix">修正</span>
      <span class="badge b-tr" id="bdgTr">翻译</span>
      <span class="chip" id="connChip" hidden>连接中断 · 重连中</span>
      <span class="chip" id="bufChip" hidden></span>
      <span class="chip" id="stopChip" hidden></span>
      <button class="stopbtn" id="panelStop" type="button"><i></i>停止</button>
    </footer>
    <div class="popover" id="settingsPop" hidden>
      <dl>
        <dt>标题</dt><dd id="spTitle">—</dd>
        <dt>说话人</dt><dd id="spSpeakers">—</dd>
        <dt>语言对</dt><dd id="spLang">—</dd>
        <dt>会话</dt><dd id="spSession">—</dd>
        <dt>连接</dt><dd id="spConn">—</dd>
      </dl>
    </div>
  </div>

  <p class="hint" id="stageHint">字幕运行中 · 拖动顶部条移动 · 所有音频仅在本机处理</p>
</div>

<!-- 结束卡 -->
<div id="endwrap" hidden>
  <div class="ecard">
    <div class="okmark">
      <svg width="22" height="22" viewBox="0 0 22 22"><path d="M4.5 11.5l4.2 4.2 8.8-9.4" fill="none"
        stroke="#34c759" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="etitle" id="endTitle">录音已保存 · 正在生成完整文稿</div>
    <p class="esub" id="endSub">完整文稿生成后可在转录工作台查看。</p>
    <a class="elink" id="endLink" hidden href="/">打开文稿</a>
    <button class="ego" id="endNew" type="button">开始新会话</button>
    <button class="ego ghost" id="endClose" type="button">关闭</button>
  </div>
</div>

<script src="live.js"></script>
</body>
</html>
